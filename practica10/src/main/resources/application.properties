spring.application.name=practica10

# Habilitar la consola de H2 para ver la base de datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ver las consultas SQL que Spring hace en la terminal
spring.jpa.show-sql=true

# Configuración de la URL de la base de datos en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=